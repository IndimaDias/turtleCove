<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Turtle Cove</title>
</head>
<body>
    <header class="tcWelcomeHeader">
        <a class="tcLogo">
            <img class="tcLogoSvg" src="images/Turtle-Cove-Logo.svg" >
            <span class="tcLogoText">Turtle Cove</span>
        </a>
    </header>
    <main class="tcWelcomePage">
        <section class="tcIntro" aria-labelledby="page-title">
            <h1 id="page-title">Welcome to  Turtle Cove</h1>

            <p> Sign in to access your personalised island of features </p>
            <p> New here? 
                 <a href="/register">Register</a> 
                 to explore endless possibilites</p>
        
            <p>Your adventure awaits - dive in!</p>

            <div class="tcWelComeScene" aria-hidden="true">
                <img class="tcTreeImage" src="images/Palm-Tree.svg" alt="">
                <img class="tcTurtleImage" src="images/Turtle.svg" alt="">
            </div>
        </section>
        <section class="tcCard" id="sign-in" aria-labelledby="sign-in-heading">
            <h2 id="sign-in-heading">Sign In</h2>
            <div class="tcSocialSignIn">
                <button id="btn-google" type="button" class="tcButton">
                    <img class="tcIconBtn" src="images/SocialMedia-Google.svg">
                </button>
                <button id="btn-facebook" type="button" class="tcButton">
                    <img class="tcIconBtn" src="images/SocialMedia-Facebook.svg">
                </button>
            </div>
            <p class="tcDivder">
                <span>OR</span>
            </p>
            <form class="tcSignInForm" id="sign-in-form" action="/sign-in" method="post" novalidate>
                <div class="tcField">
                    <label for="username">Username</label>
                    <input type="text" id="username" required name="username" autocomplete="username">
                </div>
                <div class="tcField">
                    <input type="text" id="password" required name="password" autocomplete="current-password">
                </div>

                <button type="submit" class="tcButton">Sign In</button>

                <div class="tcFormOptions">
                    <div class="tcCheckbox">
                        <input type="checkbox" id="chk-remember" name="remember">
                        <label for="chk-remember"Remember me></label>
                    </div>
                    <a href="/forgot-password">Forgot Password</a>
           
                </div>
            </form>
            <div class="tcCardFooter">
                <p>
                    Don’t already have an account?  <a href="/register"></a>Register</p>
            </div>
        </section>

    </main>
</body>
</html>
