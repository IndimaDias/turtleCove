<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Turtle Cove</title>
    <link rel="stylesheet" href="Css/welcome.css">
    <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="tcWelcomeHeader">
        <a class="tcLogo">
            <img class="tcLogoSvg" src="images/Turtle-Cove-Logo.svg" alt="">
        </a>
    </header>
    <main class="tcWelcomePage">
        <section class="tcIntro" aria-labelledby="page-title">
            <h1 id="page-title">Welcome to  Turtle Cove</h1>

            <p class="tcWelcomeText"> Sign in to access your personalised island of features </p>
            <p class="tcWelcomeText"> New here? 
                 <a href="inprogress.html">Register</a> 
                 to explore endless possibilites</p>
        
            <p >Your adventure awaits - dive in!</p>

            <div class="tcWelComeScene" aria-hidden="true">
                <img class="tcTreeImage" src="images/Palm-Tree.svg" alt="">
                <img class="tcTurtleImage" src="images/Turtle.svg" alt="">
            </div>
        </section>
        <section class="tcCard" id="sign-in" aria-labelledby="sign-in-heading">
            <h2 id="sign-in-heading">Sign In</h2>
            <div class="tcSocialSignIn">
                <button id="btn-google" type="button" class="tcButton">
                    <img class="tcIconBtn" src="images/SocialMedia-Google.svg" alt="">
                      <span class="tcLabel">
                           <span class="tcLabelLarge">Sign in </span><span class="tcLabelMobile">With </span> Google
                       </span>
                </button>
                <button id="btn-facebook" type="button" class="tcButton">
                    <img class="tcIconBtn" src="images/SocialMedia-Facebook.svg" alt="">
                        <span class="tcLabel">
                           <span class="tcLabelLarge">Sign in </span><span class="tcLabelMobile">With </span> Facebook
                       </span>
                </button>
            </div>
            <p class="tcDivider">or</p>

            <form class="tcSignInForm" id="sign-in-form" novalidate >
                <div class="tcField">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" required aria-describedby="username-error">
                    <p class="field__error" id="username-error" hidden=""></p>
                </div>
                <div class="tcField">
                    <label for="password">Password</label>
                    <input type="text" id="password" required name="password" autocomplete="current-password" aria-describedby="password-error">
                    <p class="field__error" id="password-error" hidden></p>
                </div>

                <button type="submit" class="tcButton btnSignIn">Sign In</button>

                <div class="tcFormOptions">
                    <div class="tcCheckbox">
                        <input type="checkbox" id="chk-remember" name="remember">
                        <label for="chk-remember">Remember me</label>
                    </div>
                    <a href="inprogress.html">Forgot Password</a>
           
                </div>
            </form>
            <div class="tcCardFooter">
                <p>
                    Don’t already have an account?  &nbsp; <a href="inprogress.html"> Register </a> </p>
            </div>
        </section>

    </main>

    <script src="js/main.js"></script>
</body>
</html>
